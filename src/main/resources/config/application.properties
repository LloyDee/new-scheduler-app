# Transaction pooling requires disabling JDBC server-side prepared statements.
spring.datasource.url=jdbc:postgresql://aws-1-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.szkbnypzxyobsdtxiigl
spring.datasource.password=${SUPABASE_DB_PASSWORD}

# Keep each app instance's pool small to limit database connection pressure.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=60000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
server.error.include-message=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=31MB

scheduler.app-owner-phone=${SCHEDULER_APP_OWNER_PHONE:8135160335}
