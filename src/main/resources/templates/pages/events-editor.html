<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{shared/layout :: page(editId == null ? 'Create an event' : 'Edit event', 'more', ~{::section})}">
<body>
<section class="editor-page">
  <div class="page-heading"><a th:href="@{/events}">Back to events</a></div>
  <aside class="card editor" id="editor" th:if="${showEditor}">
          
          <h2
            th:text="${editId == null ? 'Create an event' : 'Edit event'}"
          ></h2>
          <form method="post" th:action="@{/events/save}" class="form-stack" data-event-form>
            <input
              th:if="${editId != null}"
              type="hidden"
              name="id"
              th:value="${editId}"
            />
            <label
              >Event type
              <select name="type" required>
                <option value="">Choose a type…</option>
                <option
                  th:each="type : ${types}"
                  th:value="${type.name()}"
                  th:text="${type.label}"
                  th:selected="${draft['type'] == type.name()}"
                ></option></select
            ></label>
            <label data-assembly-field th:hidden="${draft['type'] != 'CIRCUIT_ASSEMBLY'}">
              Representative
              <select name="assembly" th:required="${draft['type'] == 'CIRCUIT_ASSEMBLY'}">
                <option value="">Choose a representative</option>
                <option value="with Circuit Overseer" th:selected="${draft['assembly'] == 'with Circuit Overseer'}">with Circuit Overseer</option>
                <option value="with Branch Representative" th:selected="${draft['assembly'] == 'with Branch Representative'}">with Branch Representative</option>
              </select>
            </label>
            <label>Start date
              <input type="date" name="startDate" required th:value="${draft['startDate']}" />
            </label>
            <label data-circuit-field th:hidden="${draft['type'] != 'CIRCUIT_ASSEMBLY'}">Circuit <span class="optional">optional</span>
              <input name="circuit" maxlength="60" placeholder="e.g. FL-58B" th:value="${draft['circuit']}" th:disabled="${draft['type'] != 'CIRCUIT_ASSEMBLY'}" />
            </label>
            <p class="muted" data-event-preview aria-live="polite"></p>
            <label
              >Venue <span class="optional">optional</span
              ><input name="venue" maxlength="240" th:value="${draft['venue']}"
            /></label>
            <button
              type="submit"
              th:text="${editId == null ? 'Create event' : 'Save changes'}"
            ></button
            ><a th:href="@{/events}"
              >Cancel</a
            >
          </form>
        </aside>
</section>
</body>
</html>
