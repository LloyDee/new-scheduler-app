<!doctype html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{shared/layout :: page('Events', 'more', ~{::section})}"
>
  <body>
    <section>
      <div class="page-heading" th:if="${!events.isEmpty()}">
        <a th:if="${canCreateEvent}" class="button" th:href="@{/events(create=true)}">+ Create Event</a>
      </div>
      <div class="workspace events-list-only">
        <div class="stack">
          <div class="card welcome" th:if="${events.isEmpty()}">
            <span class="welcome-symbol" aria-hidden="true">✳</span>
            <h2>Create an Event</h2>
            <p>
              Create an event to organize departments, volunteers, and schedules. App Owners, event administrators, and authorized organizers can create events.
            </p>
            <div class="page-heading">
              <a th:if="${canCreateEvent}" class="button" th:href="@{/events(create=true)}">+ Create Event</a>
            </div>
          </div>
          <article class="card" th:each="e : ${events}">
            <div class="card-heading">
              <span class="eyebrow" th:text="${e.type.label}"></span
              ><span
                class="badge success"
                th:if="${event != null and event.id == e.id}"
                >Active</span
              >
            </div>
            <h2 th:text="${e.name}"></h2>
            <p th:if="${e.type.name() == 'CIRCUIT_ASSEMBLY' and !#strings.isEmpty(e.circuit)}">Circuit: <span th:text="${e.circuit}"></span></p>
            <p class="muted">
              <span
                th:text="${#temporals.format(e.startDate, 'MMM d, yyyy')}"
              ></span>
              –
              <span
                th:text="${#temporals.format(e.endDate, 'MMM d, yyyy')}"
              ></span>
            </p>
            <p th:if="${!#strings.isEmpty(e.venue)}" th:text="${e.venue}"></p>
            <div class="card-actions">
              <form
                method="post"
                th:action="@{/events/{id}/select(id=${e.id})}"
              >
                <button class="secondary">Open event →</button>
              </form>
              <a th:if="${manageableEventIds.contains(e.id)}" th:href="@{/events(edit=${e.id})}">Edit</a>
              <form th:if="${administrableEventIds.contains(e.id)}"
                method="post"
                th:action="@{/events/{id}/delete(id=${e.id})}"
                data-confirm="Permanently delete this event and ALL its volunteers, departments, shifts, and assignments?"
              >
                <button class="text-button danger">Delete</button>
              </form>
            </div>
          </article>
          <nav th:replace="~{shared/fragments :: pagination(${listPage}, @{/events(page=${listPage.number - 1})}, @{/events(page=${listPage.number + 1})})}"></nav>
        </div>

      </div>
    </section>
  </body>
</html>
