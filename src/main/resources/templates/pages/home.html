<!doctype html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{shared/layout :: page('Home', 'home', ~{::section})}"
>
  <body>
    <section>
      <div class="page-heading">
        <div>
          <p class="eyebrow" th:text="${event != null ? event.name : ''}"></p>
<!--          <p class="muted" th:text="${event != null and event.type.name() == 'CIRCUIT_ASSEMBLY' ? event.assembly : ''}"></p>-->
        </div>
      </div>
      <div data-home-announcements aria-live="polite"></div>
      <article class="card weather-card" aria-label="Current location weather" data-weather>
        <div class="weather-scene" aria-hidden="true"><span class="weather-orb"></span><span class="weather-stars"></span><span class="weather-cloud-bank"></span><span class="weather-cloud-bank weather-cloud-bank-back"></span><span class="weather-mist"></span><span class="weather-storm-glow"></span><div class="weather-particles"><i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i><i style="--i:3"></i><i style="--i:4"></i><i style="--i:5"></i><i style="--i:6"></i><i style="--i:7"></i><i style="--i:8"></i><i style="--i:9"></i><i style="--i:10"></i><i style="--i:11"></i><i style="--i:12"></i><i style="--i:13"></i><i style="--i:14"></i><i style="--i:15"></i><i style="--i:16"></i><i style="--i:17"></i></div></div>
        <div class="weather-summary">
          <div class="weather-current">
            <span class="weather-icon" data-weather-icon aria-hidden="true"><svg viewBox="0 0 120 100" fill="none" aria-hidden="true" focusable="false">
<g class="weather-sun"><circle cx="52" cy="36" r="17" fill="#f9c65b"/><path d="M52 9V3m0 66v-6M25 36h-6m66 0h-6M33 17l-4-4m46 46-4-4M33 55l-4 4m46-46-4 4" stroke="#efb443" stroke-width="3" stroke-linecap="round"/></g>
<path class="weather-moon" d="M65 12a26 26 0 1 0 22 38A27 27 0 0 1 65 12Z" fill="#91a9da"/>
<path class="weather-cloud" d="M30 67a17 17 0 0 1-1-34 24 24 0 0 1 45-3 19 19 0 1 1 5 37Z" fill="#d3e2ee" stroke="#b5ccde" stroke-width="1.5"/>
<g class="weather-icon-rain" stroke="#6da6cf" stroke-width="3" stroke-linecap="round"><path d="m38 75-3 8m22-8-3 8m22-8-3 8"/></g>
<g class="weather-icon-snow" fill="#7fa9cc"><circle cx="37" cy="79" r="3"/><circle cx="56" cy="84" r="3"/><circle cx="76" cy="78" r="3"/></g>
<path class="weather-lightning" d="m61 54-13 20h11l-4 15 20-24H63l7-11Z" fill="#e8b644"/>
<g class="weather-icon-fog" stroke="#a5bdce" stroke-width="3" stroke-linecap="round"><path d="M19 73h72M28 82h53"/></g></svg></span>
            <div>
              <h2 class="weather-temperature"><span data-weather-temperature>—</span><span class="weather-unit">°F</span></h2>
              <p data-weather-condition>Current weather</p>
            </div>
          </div>
          <div class="weather-location">
            <strong>Current location</strong>
            <p data-weather-status role="status">Loading weather…</p>
          </div>
        </div>
        <dl class="weather-details">
          <div><dt>Feels like</dt><dd data-weather-feels>—</dd></div>
          <div><dt>Humidity</dt><dd data-weather-humidity>—</dd></div>
          <div><dt>Wind</dt><dd data-weather-wind>—</dd></div>
        </dl>
        <div class="weather-range">
          <span>High <strong data-weather-high>—</strong></span>
          <span>Low <strong data-weather-low>—</strong></span>
        </div>
        <noscript><p>Enable JavaScript to load the live weather forecast.</p></noscript>
      </article>
      <div class="stats" th:if="${event != null}">
        <a class="card stat" th:href="${base + '/volunteers'}"
          ><span class="eyebrow">VOLUNTEERS</span
          ><strong th:text="${volunteers.size()}"></strong
          ><span>Friends Ready to Serve →</span></a
        ><a class="card stat" th:href="${base + '/departments'}"
          ><span class="eyebrow">DEPARTMENTS</span
          ><strong th:text="${departments.size()}"></strong
          ><span>United in Jehovah’s Service →</span></a
        ><a class="card stat" th:href="${base + '/schedule'}"
          ><span class="eyebrow">SHIFTS</span
          ><strong th:text="${allRows.size()}"></strong
          ><span>Opportunities to Show Love →</span></a
        ><a class="card stat" th:href="${base + '/reports?type=coverage'}"
          ><span class="eyebrow">OPEN POSITIONS</span
          ><strong th:text="${missing}"></strong
          ><span>More Willing Hands Needed →</span></a
        >
      </div>
      <div class="home-shifts" th:if="${event != null}">
        <div>
          <div class="section-heading">
            <h2>Your upcoming shifts</h2>
            <a th:href="${base + '/schedule'}">View schedule →</a>
          </div>
          <div th:replace="~{shared/fragments :: shifts(${upcoming}, false)}"></div>
        </div>
      </div>
    </section>
  </body>
</html>
