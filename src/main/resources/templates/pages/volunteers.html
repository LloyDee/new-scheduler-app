<!doctype html>
<html
        lang="en"
        xmlns:th="http://www.thymeleaf.org"
        th:replace="~{shared/layout :: page('Volunteers', 'volunteers', ~{::section})}"
>
<body>
<section class="volunteers-page">
    <link rel="stylesheet" th:href="@{/css/volunteers.css}"/>
    <div class="page-heading volunteer-page-actions" th:if="${canManage}">
        <a class="button" th:href="${base + '/volunteers?create=true'}">+ Add Volunteers</a>
    </div>
    <dialog class="app-dialog volunteer-dialog" th:each="v : ${dialogVolunteers}" th:id="${'volunteer-dialog-' + v.id}" th:attr="aria-label='Details',data-open-on-load=${openVolunteerId == v.id},data-detail-url=${base + '/volunteers/' + v.id + '/detail'}"><div class="app-dialog-content" data-detail-body><h2 tabindex="-1">Details</h2><p role="status">Loading details...</p></div><form method="dialog" class="app-dialog-footer"><button>Close</button></form></dialog>
    <div class="workspace list-only">
        <div class="stack volunteer-list">
            <form
                    class="filter-bar"
                    data-volunteer-search
                    method="get"
                    th:action="@{${base + '/volunteers'}}"
            >
                <label class="grow">Search volunteers
                    <input type="search" name="q" th:value="${q}" placeholder="Name, congregation, phone or email" autocomplete="off"/>
                </label>
                <label><span class="sr-only">Filter by department</span>
                    <select name="departmentId" aria-label="Filter by department" data-auto-submit>
                        <option value="">All departments</option>
                        <option th:each="department : ${departments}" th:value="${department.id}"
                                th:text="${department.name}" th:selected="${departmentId == department.id}"></option>
                    </select>
                </label>
            </form>
            <p data-search-status role="status" aria-live="polite"></p>
            <div class="stack" data-volunteer-results>
            <div class="card" id="volunteer-assignments" th:if="${assignmentVolunteer != null}">
                <div class="section-heading">
                    <h2 th:text="${assignmentVolunteer.name + '’s assignments'}"></h2>
                    <a th:href="@{${base + '/volunteers'}(departmentId=${departmentId},q=${q})}">Close</a>
                </div>
                <p th:if="${personalRows.isEmpty()}" class="muted">No assignments yet.</p>
                <div th:unless="${personalRows.isEmpty()}"
                     th:insert="~{shared/fragments :: shifts(${personalRows}, false)}"></div>
            </div>
            <p
                    class="list-count"
                    th:text="${listPage.totalElements + ' volunteers'}"
            ></p>
            <div class="card empty" th:if="${filteredVolunteers.isEmpty()}">
                <h2>No volunteers to show</h2>
                <p>Add your first volunteer or adjust your search or department filter.</p>
            </div>
            <article class="card volunteer-card" th:each="v : ${filteredVolunteers}">
                <p class="muted" th:if="${revealedVolunteerId == v.id}">Your card — shown in addition to the current results.</p>
                <a class="volunteer-card-main"
                   th:href="@{${base + '/volunteers'}(view=${v.id},departmentId=${departmentId},q=${q})}"
                   th:attr="data-volunteer-dialog=${'volunteer-dialog-' + v.id},aria-controls=${'volunteer-dialog-' + v.id},aria-label=${'View details for ' + v.name}"
                   aria-haspopup="dialog">
                    <div class="person-heading">
              <span
                      class="avatar"
                      th:text="${#strings.substring(v.name, 0, 1)}"
              ></span>
                        <div>
                            <h2 th:id="${'volunteer-name-' + v.id}" tabindex="-1" th:classappend="${ownVolunteerIds.contains(v.id) ? 'current-user-name' : ''}" th:text="${v.name}"></h2>
                            <strong class="volunteer-admin" th:if="${v.eventAdministrator}">Admin</strong><span class="badge volunteer-you" th:if="${ownVolunteerIds.contains(v.id)}">You</span>
                            <p class="muted volunteer-congregation" th:text="${congregationLabels[v.id]}"></p>
                        </div>
                    </div>
                    <div class="contact-details">
                        <p class="volunteer-icon-line" th:if="${v.departmentRoles.isEmpty()}">No Department Yet</p>
                        <p class="volunteer-icon-line" th:if="${v.privilege != null}">
                            <svg aria-hidden="true">
                                <use href="#privilege"/>
                            </svg>
                            <span th:text="${v.privilege.label}"></span></p>
                        <p class="volunteer-icon-line" th:each="membership : ${v.departmentRoles}">
                            <svg aria-hidden="true">
                                <use href="#departments"/>
                            </svg>
                            <span th:text="${membership.key.name + ' ' + membership.value.label}"></span></p>
                    </div>
                </a>
                <div class="volunteer-menu">
                    <button type="button" class="volunteer-menu-toggle" aria-expanded="false"
                            th:attr="aria-controls=${'volunteer-menu-' + v.id},aria-label=${'Profile actions for ' + v.name}">
                        <span aria-hidden="true">&#8943;</span>
                    </button>
                    <div class="volunteer-menu-items" hidden th:id="${'volunteer-menu-' + v.id}">
                        <a th:href="@{${base + '/volunteers'}(view=${v.id},departmentId=${departmentId},q=${q})}"
                           th:attr="data-volunteer-dialog=${'volunteer-dialog-' + v.id},aria-controls=${'volunteer-dialog-' + v.id}"
                           aria-haspopup="dialog"><svg aria-hidden="true" viewBox="0 0 24 24"><use href="#people"/></svg><span>View Profile</span></a>
                        <a th:if="${(canManage and (!v.eventAdministrator or canAdminister)) or ownVolunteerIds.contains(v.id)}"
                           th:href="@{${base + '/volunteers'}(edit=${v.id})}"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m15 5 4 4M4 20l4-1L20 7a2.8 2.8 0 0 0-4-4L4 15Z"/></svg><span>Edit Profile</span></a>
                        <a th:if="${isAppOwner or canAdminister}" th:href="@{${base + '/volunteers/transfer'}(ids=${v.id})}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16m-4-4 4 4-4 4M20 17H4m4-4-4 4 4 4"/></svg><span>Add / Move Profile</span></a>
                    </div>
                </div>
            </article>
            <nav th:replace="~{shared/fragments :: pagination(${listPage}, @{${base + '/volunteers'}(page=${listPage.number - 1},departmentId=${departmentId},q=${q})}, @{${base + '/volunteers'}(page=${listPage.number + 1},departmentId=${departmentId},q=${q})})}"></nav>
            </div>
        </div>
        
    </div>
</section>
</body>
</html>
