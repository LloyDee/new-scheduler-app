<!doctype html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{shared/layout :: page('Schedule', 'schedule', ~{::section})}"
>
  <body>
    <section>
      <link rel="stylesheet" th:href="@{/css/settings-app.css}" />
      <div class="page-heading" th:if="${canManage}">
        <a class="button" th:href="${base + '/schedule?create=true'}"
          >+ Create shift</a
          >
      </div>
      <div class="card alert warning" th:if="${pending != null}">
        <h2>Assign despite the overlap?</h2>
        <p>ordered by date and time
          The conflicting assignment is listed above. Confirm only if the
          volunteer can cover both shifts.
        </p>
        <form
          method="post"
          th:action="@{${base + '/schedule/' + pending['shiftId'] + '/assign'}}"
        >
          <input
            type="hidden"
            name="volunteerId"
            th:value="${pending['volunteerId']}"
          /><input type="hidden" name="confirmOverlap" value="true" />
          <div class="card-actions">
            <button>Confirm overlapping assignment</button
            ><a th:href="${base + '/schedule'}">Cancel</a>
          </div>
        </form>
      </div>
      <div class="workspace list-only">
        <div class="stack">
          <form class="schedule-filters" method="get" th:action="@{${base + '/schedule'}}">
            <label><span class="sr-only">Filter by department</span>
              <select name="departmentId" aria-label="Filter by department" data-auto-submit>
                <option value="">All departments</option>
                <option th:each="department : ${departments}" th:value="${department.id}"
                        th:text="${department.name}" th:selected="${departmentId == department.id}"></option>
              </select>
            </label>
            <label th:if="${event.type.name() == 'REGIONAL_CONVENTION'}"><span class="sr-only">Filter by event day</span>
              <select name="date" aria-label="Filter by event day" data-auto-submit>
                <option value="">All days</option>
                <option th:each="day : ${eventDays}" th:value="${day}" th:selected="${day.equals(date)}"
                        th:text="${#temporals.format(day, 'EEE, MMM d')}"></option>
              </select>
            </label>
            <label><span class="sr-only">Filter shifts</span>
              <select name="view" aria-label="Filter shifts" data-auto-submit>
                <option value="all" th:selected="${scheduleView == 'all'}">All shifts</option>
                <option value="mine" th:selected="${scheduleView == 'mine'}">My shifts</option>
                <option value="needs" th:selected="${scheduleView == 'needs'}">Needs volunteers</option>
              </select>
            </label>
          </form>
          <p
            class="list-count"
            th:text="${listPage.totalElements + ' shifts · ordered by date and time'}"
          ></p>
          <div class="empty card" th:if="${rows.isEmpty()}">
            <h2>No shifts match these filters</h2>
            <p>Try another day, department, or shift filter.</p>
          </div>
          <section class="schedule-day" th:each="group : ${dayGroups}" th:attr="aria-labelledby=${'schedule-day-' + group.key}">
            <h2 th:id="${'schedule-day-' + group.key}" th:text="${#temporals.format(group.key, 'EEEE, MMMM d, yyyy')}"></h2>
            <div th:replace="~{shared/fragments :: shifts(${group.value}, true)}"></div>
          </section>
          <nav th:replace="~{shared/fragments :: pagination(${listPage}, @{${base + '/schedule'}(page=${listPage.number - 1},departmentId=${departmentId},date=${date},view=${scheduleView})}, @{${base + '/schedule'}(page=${listPage.number + 1},departmentId=${departmentId},date=${date},view=${scheduleView})})}"></nav>
        </div>

      </div>
    </section>
  </body>
</html>
