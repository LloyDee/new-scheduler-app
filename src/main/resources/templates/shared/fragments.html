<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <body>
    <nav th:fragment="pagination(page, previous, next)" th:if="${page.totalPages > 1}" class="list-pagination" aria-label="List pages">
      <a class="button secondary" th:if="${page.hasPrevious()}" th:href="${previous}">Previous</a>
      <span th:text="${'Page ' + (page.number + 1) + ' of ' + page.totalPages + ' · ' + page.totalElements + ' total'}"></span>
      <a class="button secondary" th:if="${page.hasNext()}" th:href="${next}">Next</a>
    </nav>
    <div th:fragment="shifts(items, editable)" class="shift-list">
      <div class="empty card" th:if="${items.isEmpty()}">
        <h3>No shifts to show</h3>
        <p>Create a shift or adjust your filters to get started.</p>
      </div>
      <article
        class="card shift-card"
        th:each="row : ${items}"
        th:id="${'shift-' + row.shift.id}"
      >
        <div class="card-heading">
          <div>
            <p class="shift-meta">
              <span class="shift-department" th:text="${row.shift.department.name}" th:title="${row.shift.department.name}"></span>
              <span aria-hidden="true">·</span>
              <span class="shift-date" th:text="${#temporals.format(row.shift.date, 'EEE, MMM d, yyyy')}"></span>
            </p>
            <div class="shift-task">
              <h3 th:text="${row.shift.name}"></h3>
              <p class="shift-time">
                <span th:text="${#temporals.format(row.shift.startTime, timePattern)}"></span>
                <span aria-hidden="true"> → </span>
                <span th:text="${#temporals.format(row.shift.endTime, timePattern)}"></span>
              </p>
            </div>
          </div>
          <div class="shift-status">
            <span
              class="badge"
              th:classappend="${row.statusClass}"
              th:text="${row.status}"
            ></span>
            <strong class="shift-assignment-count"
                    th:text="${row.assignments.size() + ' / ' + row.shift.requiredCount}"></strong>
          </div>
        </div>
        <p
          class="preserve"
          th:if="${!#strings.isEmpty(row.shift.notes)}"
          th:text="${row.shift.notes}"
        ></p>
        <div class="assigned-list" th:if="${!row.assignments.isEmpty()}">
          <div class="assigned-person" th:each="assignment : ${row.previewAssignments(ownVolunteerIds)}" th:classappend="${ownVolunteerIds.contains(assignment.volunteer.id) ? 'is-you' : ''}">
            <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4" /><path d="M4 21v-3a8 8 0 0 1 16 0v3" /></svg>
            <span class="assigned-name"><span th:text="${assignment.volunteer.name}"></span> <small class="you-badge" th:if="${ownVolunteerIds.contains(assignment.volunteer.id)}">You</small></span>
          </div>
        </div>
        <th:block th:if="${row.assignments.size() > 6}">
          <button type="button" class="text-button volunteer-view-all" th:attr="data-team-dialog=${'team-dialog-' + row.shift.id},aria-controls=${'team-dialog-' + row.shift.id}" aria-haspopup="dialog" th:text="${'View all ' + row.assignments.size() + ' volunteers'}"></button>
          <dialog class="team-sheet" th:id="${'team-dialog-' + row.shift.id}" th:attr="aria-labelledby=${'team-title-' + row.shift.id}">
            <div class="team-sheet-heading">
              <h2 th:id="${'team-title-' + row.shift.id}" th:text="${row.assignments.size() + ' volunteers'}"></h2>
              <button type="button" class="secondary" data-team-close aria-label="Close volunteer list">&#215;</button>
            </div>
            <p th:text="${row.shift.name}"></p>
            <label>Search volunteers<input type="search" data-team-search placeholder="Search by name" /></label>
            <p class="sr-only" data-team-count role="status" aria-live="polite"></p>
            <ul class="team-sheet-list">
              <li th:each="assignment : ${row.assignments}" th:classappend="${ownVolunteerIds.contains(assignment.volunteer.id) ? 'is-you' : ''}">
                <span th:text="${assignment.volunteer.name}"></span>
                <small class="you-badge" th:if="${ownVolunteerIds.contains(assignment.volunteer.id)}">You</small>
              </li>
            </ul>
            <p data-team-empty hidden>No volunteers match your search.</p>
          </dialog>
        </th:block>
        <th:block th:if="${editable and canManage}">
          <div class="shift-menu">
            <button type="button" class="shift-menu-toggle" aria-label="Shift actions" aria-expanded="false"
                    th:attr="aria-controls=${'shift-actions-' + row.shift.id}"><span aria-hidden="true">&#8943;</span></button>
            <div class="shift-menu-items" th:id="${'shift-actions-' + row.shift.id}" hidden>
              <button type="button" th:if="${!assignmentOptions[row.shift.id].isEmpty()}" th:attr="data-assignment-dialog=${'assignment-dialog-' + row.shift.id},aria-controls=${'assignment-dialog-' + row.shift.id}" aria-haspopup="dialog"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="9" cy="7" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M16 4a3 3 0 0 1 0 6m3 11v-3a6 6 0 0 0-2-4"/></svg> Choose Volunteers</button>
              <a th:href="@{${base + '/schedule'}(edit=${row.shift.id})}"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m15 4 5 5M4 20l5-1L21 7l-5-5L4 14z"/></svg> Edit Shift</a>
              <form method="post" th:action="@{${base + '/schedule/' + row.shift.id + '/delete'}}" data-confirm="Delete this shift and all its assignments?">
                <button class="danger"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/></svg> Delete Shift</button>
              </form>
            </div>
          </div>
          <th:block th:if="${!assignmentOptions[row.shift.id].isEmpty()}">
            <dialog class="app-dialog assignment-dialog" th:id="${'assignment-dialog-' + row.shift.id}"
                    th:attr="aria-labelledby=${'assignment-title-' + row.shift.id}">
              <form method="post" th:action="@{${base + '/schedule/' + row.shift.id + '/assignments'}}">
                <div class="app-dialog-content">
                  <h2 th:id="${'assignment-title-' + row.shift.id}">Choose Volunteers</h2>
                  <p><strong th:text="${row.shift.name}"></strong> ? <span th:text="${row.shift.department.name}"></span></p>
                  <fieldset class="assignment-choices">
                    <legend class="sr-only">Assigned volunteers</legend>
                    <label class="checkbox-label" th:each="v : ${assignmentOptions[row.shift.id]}">
                      <input type="checkbox" name="volunteerIds" th:value="${v.id}" th:checked="${assignedVolunteerIds[row.shift.id].contains(v.id)}" />
                      <span th:text="${v.name}"></span>
                    </label>
                  </fieldset>
                </div>
                <div class="app-dialog-footer">
                  <button type="button" class="secondary" data-assignment-cancel>Cancel</button>
                  <button type="submit" data-assignment-submit>Save</button>
                </div>
              </form>
            </dialog>
          </th:block>
          <p class="muted" th:if="${assignmentOptions[row.shift.id].isEmpty()}">
            No available volunteers in this department for this time window.
          </p>

        </th:block>
      </article>
    </div>
  </body>
</html>
